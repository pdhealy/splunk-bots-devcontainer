name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create ephemeral Splunk configuration
        run: |
          printf '%s\n' \
            'SPLUNK_START_ARGS=--accept-license' \
            'SPLUNK_PASSWORD=changeme' > config/.env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Run configuration tests
        run: node --test tests/config.test.mjs
      - name: Lint shell scripts
        run: docker run --rm -v "$PWD:/work:ro" -w /work koalaman/shellcheck:v0.10.0 scripts/bots-compose scripts/devcontainer-up scripts/test-launch-matrix
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < .devcontainer/Dockerfile

  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create ephemeral Splunk configuration
        run: |
          printf '%s\n' \
            'SPLUNK_START_ARGS=--accept-license' \
            'SPLUNK_PASSWORD=changeme' > config/.env
      - name: Build Dev Container
        run: npx --yes @devcontainers/cli@0.80.0 build --workspace-folder .
