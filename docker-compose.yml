x-splunk-defaults: &splunk-defaults
  image: splunk/splunk:8.2.3
  platform: "${SPLUNK_PLATFORM:-}"

services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ".:/workspaces/splunk-bots-devcontainer:cached"

  bots1:
    <<: *splunk-defaults
    container_name: bots1
    volumes:
      - "${BOTS_APPS_ROOT:-./apps}/botsv1:/tmp/apps"
    env_file:
      - config/.env
      - config/bots/botsv1.env
    ports:
      - "8000:8000"

  bots2:
    <<: *splunk-defaults
    container_name: bots2
    volumes:
      - "${BOTS_APPS_ROOT:-./apps}/botsv2:/tmp/apps"
      - "./data:/data:ro"
    env_file:
      - config/.env
      - config/bots/botsv2.env
    ports:
      - "8020:8000"

  bots3:
    <<: *splunk-defaults
    container_name: bots3
    volumes:
      - "${BOTS_APPS_ROOT:-./apps}/botsv3:/tmp/apps"
      - "./data:/data:ro"
    env_file:
      - config/.env
      - config/bots/botsv3.env
    ports:
      - "8030:8000"
