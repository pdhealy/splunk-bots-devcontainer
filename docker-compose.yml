services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ".:/workspaces/splunk-bots-devcontainer:cached"

  bots1:
    image: splunk/splunk:8.2.3
    platform: "${SPLUNK_PLATFORM:-}"
    container_name: bots1
    volumes:
      - "./apps/botsv1:/tmp/apps"
    env_file:
      - config/.env
      - config/botsv1.env
    ports:
      - "8000:8000"

  bots2:
    image: splunk/splunk:8.2.3
    platform: "${SPLUNK_PLATFORM:-}"
    container_name: bots2
    volumes:
      - "./apps/botsv2:/tmp/apps"
    env_file:
      - config/.env
      - config/botsv2.env
    ports:
      - "8020:8000"

  bots3:
    image: splunk/splunk:8.2.3
    platform: "${SPLUNK_PLATFORM:-}"
    container_name: bots3
    volumes:
      - "./apps/botsv3:/tmp/apps"
    env_file:
      - config/.env
      - config/botsv3.env
    ports:
      - "8030:8000"
