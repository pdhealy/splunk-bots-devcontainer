x-splunk-defaults: &splunk-defaults
  image: splunk/splunk@sha256:d4c095d0971fe6054b9b19502019bf54f79c3013726d54ed70e12ad281f5731f
  platform: "${SPLUNK_PLATFORM:-}"
  healthcheck:
    test: ["CMD-SHELL", "/opt/splunk/bin/splunk status >/dev/null 2>&1"]
    interval: 10s
    timeout: 5s
    retries: 120
    start_period: 60s

services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ".:/workspaces/splunk-bots-devcontainer:cached"

  bots1:
    <<: *splunk-defaults
    volumes:
      - "${BOTS_APPS_ROOT:-./apps}/botsv1:/tmp/apps:ro"
    env_file:
      - config/.env
      - config/bots/botsv1.env
    ports:
      - "8010:8000"

  bots2:
    <<: *splunk-defaults
    volumes:
      - "${BOTS_APPS_ROOT:-./apps}/botsv2:/tmp/apps:ro"
      - "./data:/data:ro"
    env_file:
      - config/.env
      - config/bots/botsv2.env
    ports:
      - "8020:8000"

  bots3:
    <<: *splunk-defaults
    volumes:
      - "${BOTS_APPS_ROOT:-./apps}/botsv3:/tmp/apps:ro"
      - "./data:/data:ro"
    env_file:
      - config/.env
      - config/bots/botsv3.env
    ports:
      - "8030:8000"
